<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBM Machineries</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- NAVBAR HEADER -->
    <header class="navbar-header" id="main-navbar">
        <nav class="nav-container">
            <!-- Brand Logo (Hidden on Hero, Fades in on Scroll) -->
            <a href="index.html" class="brand-logo" id="nav-brand">
                <span class="logo-bold">CBM</span> MACHINERIES
            </a>

            <!-- Mobile Hamburger Icon -->
            <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle menu">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Navigation Links -->
            <ul class="nav-menu" id="nav-menu">
                <li><a href="index.html" class="nav-link active">Home</a></li>
                <li><a href="#about" class="nav-link">About Us</a></li>
                
                <!-- Dropdown Menu Item -->
                <li class="dropdown-item">
                    <button class="dropdown-btn" id="dropdown-btn">
                        Product Categories <i class="fa-solid fa-chevron-down dropdown-icon"></i>
                    </button>
                    <div class="dropdown-content" id="dropdown-content">
                        <ul id="dynamic-categories">
                            <li><a href="#">Category Placeholder 1</a></li>
                            <li><a href="#">Category Placeholder 2</a></li>
                        </ul>
                    </div>
                </li>

                <li><a href="#contact" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO SECTION (Full Screen Video) -->
    <section class="hero-section" id="hero">
        <video autoplay muted loop playsinline class="hero-video">
            <source src="media/hero-bg.mp4" type="video/mp4">
        </video>
        
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1 class="hero-title">CBM MACHINERIES</h1>
            <p class="hero-subtitle">High-Performance Industrial Solutions</p>
        </div>
    </section>

    <!-- SPACER SECTION FOR TESTING SCROLL -->
    <section style="height: 120vh; background-color: #0d0d0d; color: #fff; padding: 4rem 2rem;">
        <h2>Content Below Hero</h2>
    </section>

    <script type="module" src="script.js"></script>
</body>
</html>
