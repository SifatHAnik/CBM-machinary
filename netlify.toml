[build]
  publish = "."

[functions]
  directory = "api"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[build.environment]
  NODE_VERSION = "20"
  # The Firebase project ID is public by design (it ships in the browser-side
  # Firebase Web config in firebase-config.js), so it is excluded from secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_PROJECT_ID"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true